name: wcm_swb
channels:
  - conda-forge
dependencies:
  - python=3.12
  - pip
  - numpy=1.26.*
  - scipy=1.14.*
  - pandas=2.2.*
  - xarray=2024.7.*
  - netcdf4=1.7.*
  - h5netcdf=1.3.*
  - h5py=3.11.*
  - matplotlib=3.9.*
  - seaborn=0.13.*
  - numba=0.60.*
  - pymc=5.16.*
  - pytensor=2.23.*
  - arviz=0.19.*
  - geopandas=1.0.*
  - rasterio=1.3.*
  - ipykernel=6.29.*
  - jupyterlab
  - cmcrameri
  # From conda-forge, not pip: a pip install pulls the latest SALib, which
  # upgrades numpy to 2.x over the pin above and breaks pytensor 2.23.
  - salib
  - pytest
